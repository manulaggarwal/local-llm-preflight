name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC) — no tokens stored anywhere
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build --sdist --wheel

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Run unit tests against the built package
        run: |
          pip install dist/*.whl
          pip install pytest
          pytest tests/ -q

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A release re-publish or manual re-dispatch of an already-live
          # version must not fail the run — skip files that already exist.
          skip-existing: true
