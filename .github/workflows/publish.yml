name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC) — no tokens stored anywhere
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce version invariant (pyproject == __init__.py, matches tag if present)
        run: |
          set -e
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT_VERSION=$(python -c "import llm_preflight; print(llm_preflight.__version__)")
          if [ "$PKG_VERSION" != "$INIT_VERSION" ]; then
            echo "::error::pyproject version $PKG_VERSION != __init__.py version $INIT_VERSION."
            exit 1
          fi
          REF=${GITHUB_REF_NAME:-}
          if [[ "$REF" == v* ]]; then
            if [ "$REF" != "v$PKG_VERSION" ]; then
              echo "::error::Tag $REF does not match package version $PKG_VERSION. Bump pyproject.toml + __init__.py first."
              exit 1
            fi
          fi
          echo "version OK: pyproject=__init__=$PKG_VERSION (ref: $REF)"

      - name: Build clean (no stale build/ cache reuse)
        run: |
          rm -rf build dist
          pip install build twine
          python -m build --sdist --wheel

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Run unit tests against the built package
        run: |
          pip install dist/*.whl
          pip install pytest
          pytest tests/ -q

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A release re-publish or manual re-dispatch of an already-live
          # version must not fail the run — skip files that already exist.
          skip-existing: true
