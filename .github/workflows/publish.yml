name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC) — no tokens stored anywhere
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version (fail fast on forgotten bumps)
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          REF=${GITHUB_REF_NAME}
          if [[ "$REF" == v* ]]; then
            if [ "$REF" != "v$PKG_VERSION" ]; then
              echo "::error::Tag $REF does not match pyproject version $PKG_VERSION. Bump pyproject.toml + __init__.py, or the release is lying."
              exit 1
            fi
          else
            echo "manual dispatch from '$REF' — skipping tag check"
          fi

      - name: Build clean (no stale build/ cache reuse)
        run: |
          rm -rf build dist
          pip install build twine
          python -m build --sdist --wheel

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Run unit tests against the built package
        run: |
          pip install dist/*.whl
          pip install pytest
          pytest tests/ -q

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A release re-publish or manual re-dispatch of an already-live
          # version must not fail the run — skip files that already exist.
          skip-existing: true
